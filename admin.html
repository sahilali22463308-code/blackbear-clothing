<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.png"><title>BlackBear Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f3;color:#111}.nav{background:#111;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}.logo{display:flex;align-items:center;gap:10px;font-weight:bold;letter-spacing:2px}.logo img{width:38px;height:38px;border-radius:50%}.wrap{padding:40px 6%;max-width:1200px;margin:auto}.panel{background:#fff;padding:25px;margin-bottom:25px;border:1px solid #ddd}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.form input,.form textarea{padding:13px;border:1px solid #ccc;width:100%}.form textarea{min-height:90px}.full{grid-column:1/-1}.btn{background:#111;color:#fff;border:0;padding:13px 18px;cursor:pointer}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.item{border:1px solid #ddd;padding:12px}.item img{width:100%;aspect-ratio:1;object-fit:cover}.danger{background:#b00020}.status{font-size:12px;color:#666}@media(max-width:700px){.form,.products{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header class="nav"><div class="logo"><img src="assets/logo.png">BLACKBEAR ADMIN</div><a href="index.html" style="color:#fff">View Store</a></header><main class="wrap"><div class="panel"><h2>Add New Shirt</h2><p class="status" id="status"></p><form id="form" class="form"><input id="name" placeholder="Shirt name" required><input id="price" type="number" placeholder="Price (PKR)" required><input id="stock" type="number" placeholder="Stock" required><input id="sizes" placeholder="Sizes: S,M,L,XL" value="S,M,L,XL"><input id="image" class="full" placeholder="Product image URL"><textarea id="desc" class="full" placeholder="Description"></textarea><button class="btn full">Add Shirt</button></form></div><div class="panel"><h2>Products</h2><div class="products" id="products"></div></div><div class="panel"><h2>Orders</h2><div id="orders">Loading...</div></div></main><script src="js/config.js"></script><script src="js/store.js"></script><script>
const $=id=>document.getElementById(id);$('status').textContent=BlackBearStore.ready?'Online database connected.':'Demo mode: add Supabase URL/key in js/config.js for online data.';
async function render(){const p=await BlackBearStore.getProducts();$('products').innerHTML=p.length?p.map(x=>`<div class="item"><img src="${x.image_url||'assets/logo.png'}"><b>${x.name}</b><p>PKR ${x.price} · Stock ${x.stock||0}</p><button class="btn danger" onclick="del('${x.id}')">Delete</button></div>`).join(''):'No products yet.';const o=await BlackBearStore.getOrders();$('orders').innerHTML=o.length?o.map(x=>`<div style="padding:12px 0;border-bottom:1px solid #ddd"><b>${x.customer_name}</b> — ${x.phone}<br>${x.address}<br>Total: PKR ${x.total} · ${x.status}</div>`).join(''):'No orders yet.'}
$('form').onsubmit=async e=>{e.preventDefault();await BlackBearStore.addProduct({name:$('name').value,price:Number($('price').value),stock:Number($('stock').value),sizes:$('sizes').value.split(',').map(x=>x.trim()).filter(Boolean),image_url:$('image').value,description:$('desc').value});e.target.reset();$('sizes').value='S,M,L,XL';render()};window.del=async id=>{if(confirm('Delete this product?')){await BlackBearStore.deleteProduct(id);render()}};render();
</script></body></html>
